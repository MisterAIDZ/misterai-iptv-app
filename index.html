<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MisterAI Xtream Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-black text-white font-sans">

    <div class="flex h-screen">
        <div class="w-1/3 md:w-1/4 bg-gray-900 border-l border-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-800 bg-blue-900 font-bold text-center">
                قنوات Michelle 📺
                <button onclick="fetchXtream()" class="block text-xs mt-2 underline">تحديث القائمة</button>
            </div>
            <div id="channelList" class="overflow-y-auto flex-1 p-2 space-y-2">
                <p class="text-center text-gray-500 mt-10">اضغط تحديث لجلب القنوات...</p>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-slate-950">
            <div class="relative w-full aspect-video bg-black shadow-2xl">
                <video id="mainVideo" controls class="w-full h-full"></video>
                <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-black/50">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500"></div>
                </div>
            </div>
            <div class="p-6">
                <h1 id="currentTitle" class="text-2xl font-bold text-blue-400">اختر قناة لبدء البث</h1>
                <p class="text-gray-500 mt-2">نظام Xtream Codes - MisterAI</p>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const loader = document.getElementById('loader');

        async function fetchXtream() {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = "<p class='text-center'>جاري التحميل...</p>";
            
            try {
                const res = await fetch('/api');
                const channels = await res.json();
                
                listContainer.innerHTML = "";
                channels.forEach(ch => {
                    const btn = document.createElement('div');
                    btn.className = "p-3 bg-gray-800 rounded hover:bg-blue-700 cursor-pointer transition text-sm truncate border-r-4 border-transparent hover:border-blue-400";
                    btn.innerHTML = ch.name;
                    btn.onclick = () => playChannel(ch.url, ch.name);
                    listContainer.appendChild(btn);
                });
            } catch (err) {
                listContainer.innerHTML = "<p class='text-red-500 text-center'>خطأ في الجلب</p>";
            }
        }

        function playChannel(url, name) {
            document.getElementById('currentTitle').innerText = name;
            loader.classList.remove('hidden');
            
            // نظام Xtream يحتاج غالباً لمشغل يدعم الـ TS أو HLS
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    loader.classList.add('hidden');
                });
            } else {
                video.src = url;
                video.play();
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
